<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeINN</title>

    <!-- Bootstrap CSS for layout grid -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <!-- Loading Google fonts for clean modern typography -->
     <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap">

     <!-- Custom styles -->
      <link rel="stylesheet" href="css/style.css">

      <!-- AngularJS & ngRoute CDN -->
       <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
       <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular-route.min.js"></script>

       <!-- D3.js for visual analytics -->
        <script src="https://d3js.org/d3.v7.min.js"></script>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f8f9fa;
        }
    </style>
</head>
<body ng-app="homeInnApp" ng-controller="MainController">

     <!-- Navigation bar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <!-- Brand with Logo here... -->
         <a href="#!/" class="navbar-brand fw-bold text-warning d-flex align-items-center gap-2 text-decoration-none">
            <img src="Logo/Logo | HomeINN | Wednesday, 21 October, 2026.png" alt="HomeINN logo" style="height: 35px; width: auto;" class="rounded">
            <span>HomeINN</span>
         </a>
        
        <!-- Single Unified Navbar Links & Actions -->
        <div class="navbar-nav ms-auto align-items-center flex-row gap-3">
            <a class="nav-link text-white" href="#!/">Home</a>
            <a class="nav-link text-white" href="#!/listings">Hostel/Flats </a>
            <a class="nav-link text-white" href="#!/listings"> pg / flats </div></a>
            <a class="nav-link text-white" href="#!/dashboard">Dashboard</a>
            <a href="#!/add-property" class="btn btn-warning text-dark fw-bold px-3 py-1">Add Property</a>

            <!-- Auth Button / Dropdown -->
            <a ng-if="!currentUser.loggedIn" href="#!/login" class="btn btn-outline-light btn-sm ms-2">
                Login / Register
            </a>
            <div ng-if="currentUser.loggedIn" class="dropdown ms-2">
                <button class="btn btn-secondary btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown">
                    {{currentUser.username}}
                </button>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><a class="dropdown-item" href="#!/dashboard">My Dashboard</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><button class="dropdown-item text-danger" ng-click="logout()">Logout</button></li>
                </ul>
            </div>
        </div>
    </div>
</nav>

     <!-- Dynamic SPA View Injection -->
      <div ng-view></div>

      <!-- Bootstrap JS Bundle for Modals and Dropdowns -->
       <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

      <!-- Angular JS App Scripts -->
       <script src="JS/app.js"></script>
       <script src="JS/services/propertyService.js"></script>
       <script src="JS/controllers/mainController.js"></script>
       <script src="JS/controllers/searchController.js"></script>
       <script src="JS/controllers/detailController.js"></script>
       <script src="JS/controllers/addController.js"></script>
    
</body>
</html>
