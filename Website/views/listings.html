<div class="container my-5">
    <h2 class="fw-bold mb-4">Available Student Accommodations Near UPES</h2>

    <div class="row">
        <!-- Sidebar Filters -->
        <div class="col-md-3 mb-4">
            <div class="p-4 bg-white rounded shadow-sm border">
                <h5 class="fw-bold mb-3">Filter Options</h5>

                <div class="mb-3">
                    <label class="form-label text-muted">Search Keyword</label>
                    <input type="text" class="form-control" ng-model="searchText" placeholder="e.g. Wi-Fi, Gate 1">
                </div>

                <div class="mb-3">
                    <label class="form-label text-muted">Accommodation Type</label>
                    <select class="form-select" ng-model="selectedType">
                        <option value="">All Types</option>
                        <option value="hostel">Hostel</option>
                        <option value="flat">Flat</option>
                        <option value="house">House</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label text-muted">Max Monthly Rent: ₹{{maxPrice}}</label>
                    <input type="range" class="form-range" min="3000" max="30000" step="1000" ng-model="maxPrice">
                </div>
            </div>
        </div>

        <!-- Property Cards Grid -->
        <div class="col-md-9">
            <div ng-if="loading" class="text-center py-5">
                <div class="spinner-border text-warning" role="status"></div>
                <p class="text-muted mt-2">Loading HomeINN listings...</p>
            </div>

            <div class="row g-4" ng-hide="loading">
                <div class="col-md-4" ng-repeat="property in properties | filter:searchText | filter:matchFilter">
                    <div class="card h-100 shadow-sm border-0">
                        <div class="card-body">
                            <span class="badge bg-warning text-dark mb-2 text-uppercase fw-bold">{{property.type}}</span>
                            <h5 class="card-title fw-bold">{{property.title}}</h5>
                            <p class="text-muted small mb-2">📍 {{property.campusProximity || property.distance}}</p>
                            <h6 class="text-success fw-bold">₹{{property.rent | number}} / month</h6>

                            <div class="mt-3">
                                <span class="badge bg-light text-dark border me-1 mb-1" ng-repeat="amenity in property.amenities">{{amenity}}</span>
                            </div>
                        </div>
                        <div class="card-footer bg-white border-0 pb-3">
                            <a ng-href="#!/property/{{property._id}}" class="btn btn-outline-dark btn-sm w-100">View Details & 360° Tour</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
